<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Calculadora de Média de Notas</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="container">
    <h1>Calculadora de Média de Notas</h1>

    <section class="panel">
      <form id="form-nota" autocomplete="off" novalidate>
        <label for="nota">Introduz uma nota (0–20):</label>
        
        <div class="row">
          <input id="nota" name="nota" type="text" inputmode="decimal" placeholder="ex.: 15.5" aria-describedby="ajuda-nota">
          <button type="button" class="btn primary" onclick="adicionarNota()">Adicionar</button>
        </div>
        <small id="ajuda-nota" class="muted">Enter também adiciona. Esc limpa o campo.</small>
        <p id="erro" class="erro" role="alert" aria-live="polite"></p>
      </form>
      
      
      
    </section>

    <section class="panel">
      <h2>Notas inseridas</h2>
      <ul id="lista-notas" class="lista"></ul>
      <div class="acoes">
        <button id="btn-limpar" class="btn" onclick="limparNotas()">Limpar notas</button>
        <button id="btn-media" class="btn success" onclick="calcularMedia()">Calcular média</button>
      </div>
      <div id="resultado" class="resultado" aria-live="polite"></div>
    </section>
    
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
